name: Build Cross-Platform

on:
  # Automatic: Build on pull requests to main
  pull_request:
    branches: [main]
  
  # Automatic: Build on push to main
  push:
    branches: [main]
  
  # Manual: Click "Run workflow" anytime you need fresh artifacts
  workflow_dispatch:

jobs:
  # Run tests first
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./... -v

  # Build the CLI tool for all platforms
  build-cli:
    name: Build CLI - ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - os: windows
            goos: windows
            goarch: amd64
            ext: .exe
          - os: linux
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -o bin/qa-cli-${{ matrix.os }}${{ matrix.ext }} ./cmd/cli/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-cli-${{ matrix.os }}
          path: bin/qa-cli-${{ matrix.os }}${{ matrix.ext }}

  # Build the Wails GUI app for Windows
  build-gui-windows:
    name: Build GUI - Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows GUI
        working-directory: cmd/gui
        run: wails build -platform windows/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-gui-windows
          path: cmd/gui/build/bin/*.exe

  # Build the Wails GUI app for Linux
  build-gui-linux:
    name: Build GUI - Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux GUI
        working-directory: cmd/gui
        run: wails build -tags webkit2_41 -platform linux/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-gui-linux
          path: cmd/gui/build/bin/*

  # Build the Wails GUI app for macOS
  build-gui-macos:
    name: Build GUI - macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS GUI (Universal)
        working-directory: cmd/gui
        run: wails build -platform darwin/universal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-gui-macos
          path: cmd/gui/build/bin/*.app
