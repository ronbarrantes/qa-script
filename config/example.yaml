# QA Script Configuration Example
#
# This file defines how locations are grouped in the output Excel.
#
# LOCATION FORMAT:
# Locations follow the format PREFIX:CODE (e.g., "SS4:GF225.B")
# - PREFIX (before colon): Preserved in output but ignored for grouping/sorting
# - CODE (after colon): Used for grouping and sorting (e.g., "GF225.B")
#
# OUTPUT FORMAT:
# - Output is written to a sheet named "Groups"
# - Each group becomes a column (or multiple columns if items exceed 'size')
# - Groups are separated by blank columns
# - Headers repeat for each spilled column (with bold text, gray background)
# - Locations with QA_HOLD_PICKING status (from optional Excel input) are highlighted yellow
# - Unassigned locations (not matching any group) appear in an "unassigned" column at the end
# - Output file is auto-named: locations_<timestamp>.xlsx
#
# Example output with size: 3 and 5 items in "e - g":
#
#   | pallets     |   | e - g       | e - g       |   | h - k       |
#   |-------------|---|-------------|-------------|---|-------------|
#   | PS1:AB215   |   | SS4:EN15.A  | SS4:GF253.B |   | PS2:HA101   |
#   | PS1:LUD86   |   | SS4:EN333.C | SS4:GC111.A |   | PS2:JB202   |
#   | SS2:CS121.A |   | SS4:GFT31.A |             |   |             |
#
# VALUES MATCHING:
# The CODE portion (after the colon) has a letter prefix used for matching.
#
# - Single letter (e.g., "a"): matches any code whose letter prefix starts with that letter
#   Example: "a" matches SS4:AB215 (letter prefix "AB" starts with "A")
# - Multi-letter (e.g., "lud", "gft"): exact match for the full letter prefix
#   Example: "lud" matches PS1:LUD86 (letter prefix "LUD")
#   Example: "gft" matches SS4:GFT31.A (letter prefix "GFT") but NOT SS4:GF225.B ("GF")

groups:
  - name: pallets
    values: a, b, c, lud, prm, slp

  - name: e - g
    values: e, f, g, gft, hwk, hvc

  - name: h - k
    values: h, j, k

  - name: lm
    values: l, m

  - name: n - t
    values: n, s, t, mez

# Maximum rows per column before spilling to next column
size: 20
