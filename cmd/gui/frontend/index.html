<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Location Grouper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>QA Location Grouper</h1>
        
        <div class="drop-zones">
            <div class="drop-zone" id="locations-zone" ondrop="handleDrop(event, 'locations')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div class="drop-icon">📄</div>
                <div class="drop-label">Locations CSV</div>
                <div class="drop-hint">Drop file here or click to browse</div>
                <div class="file-name" id="locations-file"></div>
                <input type="file" id="locations-input" accept=".csv" style="display: none" onchange="handleFileSelect(event, 'locations')">
            </div>
            
            <div class="drop-zone" id="priorities-zone" ondrop="handleDrop(event, 'priorities')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div class="drop-icon">📊</div>
                <div class="drop-label">Priorities XLSX</div>
                <div class="drop-hint">Drop file here or click to browse</div>
                <div class="file-name" id="priorities-file"></div>
                <input type="file" id="priorities-input" accept=".xlsx" style="display: none" onchange="handleFileSelect(event, 'priorities')">
            </div>
        </div>
        
        <div class="status" id="status">
            <span class="status-message" id="status-message"></span>
            <button class="open-file-btn" id="open-file-btn" onclick="openOutputFile()" style="display: none;">Open</button>
        </div>
        
        <div class="buttons">
            <button class="btn btn-secondary" id="reset-btn" onclick="resetFiles()">Reset</button>
            <button class="btn btn-primary" id="ok-btn" onclick="processFiles()" disabled>OK</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
