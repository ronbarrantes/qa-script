<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Location Grouper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QA Location Priorities</h1>
            <button class="settings-btn" id="settings-btn" onclick="openSettings()" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
        
        <div class="drop-zones">
            <div class="drop-zone" id="locations-zone" ondrop="handleDrop(event, 'locations')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div class="drop-icon">📄</div>
                <div class="drop-label">Locations CSV</div>
                <div class="drop-hint">Drop file here or click to browse</div>
                <div class="file-name" id="locations-file"></div>
                <input type="file" id="locations-input" accept=".csv" style="display: none" onchange="handleFileSelect(event, 'locations')">
            </div>
            
            <div class="drop-zone" id="priorities-zone" ondrop="handleDrop(event, 'priorities')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div class="drop-icon">📊</div>
                <div class="drop-label">Priorities XLSX</div>
                <div class="drop-hint">Drop file here or click to browse</div>
                <div class="file-name" id="priorities-file"></div>
                <input type="file" id="priorities-input" accept=".xlsx" style="display: none" onchange="handleFileSelect(event, 'priorities')">
            </div>
        </div>
        
        <div class="status" id="status">
            <span class="status-message" id="status-message"></span>
            <button class="open-file-btn" id="open-file-btn" onclick="openOutputFile()" style="display: none;">Open</button>
        </div>
        
        <div class="buttons">
            <button class="btn btn-secondary" id="reset-btn" onclick="resetFiles()">Reset</button>
            <button class="btn btn-primary" id="ok-btn" onclick="processFiles()" disabled>OK</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Rules Settings</h2>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="settings-section">
                    <h3>Groups</h3>
                    <div class="groups-list" id="groups-list">
                        <!-- Groups will be dynamically populated -->
                    </div>
                    <button class="add-group-btn" onclick="addGroup()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Group
                    </button>
                </div>
                
                <div class="settings-row">
                    <div class="settings-field">
                        <label for="max-rows">Max Rows</label>
                        <input type="number" id="max-rows" min="1" max="100" value="20">
                    </div>
                    <div class="settings-field">
                        <label for="column-gap">Column Gap</label>
                        <input type="number" id="column-gap" min="0" max="10" value="1">
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="resetToDefaults()">Defaults</button>
                <div class="modal-footer-right">
                    <button class="btn btn-secondary" onclick="resetSettings()">Reset</button>
                    <button class="btn btn-primary" onclick="saveSettings()">OK</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
